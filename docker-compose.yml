# DigiBooks - the whole application in Docker.
# All values come from the root .env file - nothing is hardcoded here.
#
#   Everything:          docker compose up -d --build
#   Only the database:   docker compose up -d postgres      (when you run the code yourself)
#   Logs:                docker compose logs -f backend
#   Stop:                docker compose down
#   Reset all data:      docker compose down -v
#
# Services:
#   postgres  - the database (data kept in the "postgres_data" volume)
#   backend   - the API; applies database migrations on every start
#   scheduler - runs the daily job (recurring transactions, late fees, reminders, scheduled reports)
#   frontend  - the web app

x-backend-settings: &backend-settings
  env_file: .env
  environment:
    # Inside Docker the database is the "postgres" service, not localhost.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    DATABASE_URL: ""
    # Read here (not only from env_file) so they can be overridden from the shell,
    # e.g. when running on other ports.
    CORS_ORIGINS: ${CORS_ORIGINS}
    PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    # The business's time zone decides what "today" is (containers are UTC otherwise).
    TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:17-alpine
    container_name: ledgerly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-settings
    build: ./backend
    image: ledgerly-backend
    container_name: ledgerly-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  scheduler:
    <<: *backend-settings
    image: ledgerly-backend
    container_name: ledgerly-scheduler
    restart: unless-stopped
    command: ["./docker/scheduler.sh"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-DigiBooks}
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_LOCALE: ${APP_LOCALE:-en-US}
        NEXT_PUBLIC_DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
    image: ledgerly-frontend
    container_name: ledgerly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
